version: '3.8'

services:
  # Backend API & WebSocket Service (Node.js / Express / Socket.IO)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://chatapp:YOUR_LOCAL_PASSWORD@postgres:5432/chatapp
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=CHOOSE_A_LONG_CRYPTOGRAPHICALLY_RANDOM_SECRET_KEY
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=chatapp
      - S3_ACCESS_KEY=YOUR_LOCAL_ACCESS_KEY
      - S3_SECRET_KEY=YOUR_LOCAL_SECRET_KEY
      - SMTP_PORT=587
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # Frontend Web Client (React 19 / Vite / Tailwind CSS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
      - VITE_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend

  # Developer-Owned PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chatapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: YOUR_LOCAL_PASSWORD
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Developer-Owned Redis (Pub/Sub, Presence, Distributed State)
  redis:
    image: redis:7-alpine
    container_name: chatapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-Hosted S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: chatapp_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: YOUR_LOCAL_ACCESS_KEY
      MINIO_ROOT_PASSWORD: YOUR_LOCAL_SECRET_KEY
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # MinIO Management Console
  minio-console:
    image: minio/minio:latest
    container_name: chatapp_minio_console
    restart: unless-stopped
    network_mode: "service:minio"
    depends_on:
      - minio

volumes:
  postgres_data:
    name: chatapp_postgres_data
  redis_data:
    name: chatapp_redis_data
  minio_data:
    name: chatapp_minio_data
