events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;

  upstream backend_api {
    server backend:4000;
    keepalive 32;
  }

  upstream frontend_app {
    server frontend:3000;
    keepalive 32;
  }

  upstream minio_s3 {
    server minio:9000;
  }

  upstream minio_console {
    server minio:9001;
  }

  # ============================================================================
  # 1. FRONTEND APP: https://YOUR-DOMAIN.com
  # ============================================================================
  server {
    listen 80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    location / {
      proxy_pass http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ============================================================================
  # 2. BACKEND & REAL-TIME WEBSOCKET: https://api.YOUR-DOMAIN.com
  # ============================================================================
  server {
    listen 80;
    server_name api.YOUR-DOMAIN.com;

    client_max_body_size 50M;

    # Real-Time WebSocket (Socket.IO)
    location /socket.io/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Auth rate limit
    location /api/v1/auth/ {
      limit_req zone=auth_rate_limit burst=10 nodelay;
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # General API /api/v1 and /api
    location /api/ {
      limit_req zone=api_rate_limit burst=100 nodelay;
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static media fallback
    location /uploads/ {
      proxy_pass http://backend_api;
      expires 30d;
      add_header Cache-Control "public, no-transform";
    }

    location / {
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ============================================================================
  # 3. SELF-HOSTED S3 / MINIO: https://storage.YOUR-DOMAIN.com
  # ============================================================================
  server {
    listen 80;
    server_name storage.YOUR-DOMAIN.com;

    client_max_body_size 100M;

    location / {
      proxy_pass http://minio_s3;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300;
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
    }
  }
}
